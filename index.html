<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PartyAllo Event Packing Tracker — admin console for events, crew, station catalogues and packing progress."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />

    <title>PartyAllo Admin · Event Packing Tracker</title>

    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong surface. The ThemeProvider takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem('partyallo.admin.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

          var color = localStorage.getItem('partyallo.admin.primary-color');
          if (color) document.documentElement.style.setProperty('--primary', color);
        } catch (error) {
          /* localStorage unavailable — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
